name: Build and push tor

on:
  push:
    paths:
      - Dockerfile.tor
  schedule:
    # Rebuild weekly to pick up Tor APT repo updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, nixos]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          docker build -f Dockerfile.tor \
            -t ghcr.io/2143-labs/tor:${{ github.run_number }} \
            -t ghcr.io/2143-labs/tor:latest .
          docker push ghcr.io/2143-labs/tor:${{ github.run_number }}
          docker push ghcr.io/2143-labs/tor:latest

  bump-base:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin

      - name: Update base image tag
        working-directory: base
        run: |
          kustomize edit set image tor:latest=ghcr.io/2143-labs/tor:${{ github.run_number }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump tor image to ${{ github.run_number }} [skip ci]"
          file_pattern: base/kustomization.yaml
