name: Build and push tor

on:
  push:
    paths:
      - Dockerfile.tor
  schedule:
    # Rebuild weekly to pick up Tor APT repo updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, nixos]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          # --no-cache: the apt-get install tor layer would otherwise be reused
          # from the local docker store and never re-query the Tor APT repo.
          docker build --pull --no-cache -f Dockerfile.tor \
            -t ghcr.io/2143-labs/tor:${{ github.run_number }} \
            -t ghcr.io/2143-labs/tor:latest .
          docker push ghcr.io/2143-labs/tor:${{ github.run_number }}
          docker push ghcr.io/2143-labs/tor:latest

  bump-base:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin

      - name: Update tor image tag
        working-directory: overlays/prod
        run: |
          kustomize edit set image ghcr.io/2143-labs/tor:latest=ghcr.io/2143-labs/tor:${{ github.run_number }}

      - name: Assert tag bump took effect
        working-directory: overlays/prod
        run: |
          grep -qF 'newTag: "${{ github.run_number }}"' kustomization.yaml \
            || { echo "tag bump did not land in overlays/prod/kustomization.yaml"; exit 1; }

      - name: Assert rendered image is pinned
        run: |
          kustomize build overlays/prod | grep -qF "image: ghcr.io/2143-labs/tor:${{ github.run_number }}" \
            || { echo "rendered tor image is not pinned to ${{ github.run_number }}"; exit 1; }

      - uses: stefanzweifel/git-auto-commit-action@v5
        id: auto-commit
        with:
          commit_message: "chore: bump tor image to ${{ github.run_number }} [skip ci]"
          file_pattern: overlays/prod/kustomization.yaml

      - name: Fail if bump did not commit
        if: steps.auto-commit.outputs.changes_detected == 'false'
        run: exit 1
