apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: mongo-creds, namespace: default}
spec:
  refreshInterval: 10m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-doks}
  target: {name: mongo-creds, creationPolicy: Owner}
  dataFrom:
    - extract: {key: doks/default/mongo-creds}
