apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: github-token, namespace: flux-system}
spec:
  refreshInterval: 10m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-doks}
  target: {name: github-token, creationPolicy: Owner}
  dataFrom:
    - extract: {key: doks/flux-system/github-token}
