apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: desec-dns, namespace: cert-manager}
spec:
  refreshInterval: 10m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-doks}
  target: {name: desec-dns, creationPolicy: Owner}
  dataFrom:
    - extract: {key: doks/default/desec-dns}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: desec-dns-john, namespace: cert-manager}
spec:
  refreshInterval: 10m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-doks}
  target: {name: desec-dns-john, creationPolicy: Owner}
  dataFrom:
    - extract: {key: doks/default/desec-dns-john}
