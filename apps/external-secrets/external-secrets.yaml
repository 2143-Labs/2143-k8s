apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: external-secrets, namespace: flux-system}
spec:
  interval: 1h
  releaseName: external-secrets
  targetNamespace: external-secrets
  chart:
    spec: {chart: external-secrets, version: "2.15.0",
           sourceRef: {kind: HelmRepository, name: external-secrets, namespace: flux-system}}
  install: {crds: CreateReplace, createNamespace: true}
  upgrade: {crds: CreateReplace}
  values:
    systemAuthDelegator: true
    resources:
      requests: {cpu: 50m, memory: 128Mi}
    webhook:
      resources:
        requests: {cpu: 25m, memory: 64Mi}
    certController:
      resources:
        requests: {cpu: 25m, memory: 64Mi}
