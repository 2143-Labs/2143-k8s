apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: reloader, namespace: flux-system}
spec:
  interval: 1h
  releaseName: reloader
  targetNamespace: reloader
  chart:
    spec: {chart: reloader, version: "2.2.20",
           sourceRef: {kind: HelmRepository, name: stakater, namespace: flux-system}}
  install: {createNamespace: true}
  values:
    reloader:
      deployment:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
