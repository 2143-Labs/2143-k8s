# Owned by the Flux Kustomization `nginx-gateway`
# (clusters/prod/flux-system/kustomization-nginx-gateway.yaml), not by `prod`.
#
# nginx-gateway-fabric-2.8.1.yaml is rendered, not hand-written. Release name and
# nameOverride must both be `nginx-gateway`: they set the object names and the
# immutable Deployment selector of the existing install.
#   helm template nginx-gateway oci://ghcr.io/nginx/charts/nginx-gateway-fabric \
#     --version 2.8.1 --namespace nginx-gateway --include-crds \
#     --set nameOverride=nginx-gateway \
#     --set nginxGateway.productTelemetry.enable=false \
#     --set nginx.config.ipFamily=dual \
#     --set nginx.service.type=LoadBalancer \
#     --set nginx.service.externalTrafficPolicy=Local \
#     --set nginx.replicas=1
# gateway-api-v1.6.3-standard-install.yaml is the upstream release asset.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway-api-v1.6.3-standard-install.yaml
  - nginx-gateway-fabric-2.8.1.yaml
patches:
  # Never garbage-collect the CRDs: deleting them deletes every Gateway and
  # HTTPRoute, and with them the dataplane and its DO load balancer.
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
        value: disabled
  # Helm pre-install/pre-upgrade hook. With its 30 s TTL, Flux would re-create
  # and re-run it every interval; without it, it runs again only when its spec
  # changes (force: true recreates the immutable Job).
  - target:
      kind: Job
      name: nginx-gateway-cert-generator
    patch: |-
      - op: remove
        path: /spec/ttlSecondsAfterFinished
