apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-gateway
  namespace: flux-system
spec:
  interval: 10m
  path: ./nginx-gateway
  prune: true
  force: true
  sourceRef:
    kind: GitRepository
    name: 2143-k8s
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: nginx-gateway
      namespace: nginx-gateway
