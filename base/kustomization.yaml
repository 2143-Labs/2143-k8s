apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
#- https://raw.githubusercontent.com/nginxinc/nginx-gateway-fabric/0ade9ede5c5be1eb7137308c08c7c17608515ca8/deploy/crds.yaml
#- github.com/nginxinc/nginx-gateway-fabric/config/crd/gateway-api/standard
#- github.com/nginxinc/nginx-gateway-fabric/config/crd/gateway-api/experimental
#- openfront-pro-timeouts-proxy.yaml
resources:
- deployments.yaml
- deployment-labs-site.yaml
- deployments-openfrontpro.yaml
- deployments-openfront-discordbot.yaml
- gateway.yaml
- httproute.yaml
- endpoint-base.yaml
- client-settings-policy.yaml
- deployments-derp.yaml
- deployment-tor.yaml
- tailscale-exit.yaml
- wireguard-doks.yaml
- tcproute.yaml
- service-mongo-nodeport.yaml
# Add the crds for gateway api

# Static site content, served by the labs-site Deployment. Kustomize does not
# glob generator inputs, so every file under base/site/ must be listed here.
# The name suffix hash makes content changes roll the pods.
configMapGenerator:
- name: labs-site-html
  files:
  - site/index.html
  - site/style.css
  - site/favicon.svg
  - site/tile.svg
  - site/robots.txt
