apiVersion: apps/v1
kind: Deployment
metadata:
  name: labs-site
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: labs-site
  template:
    metadata:
      labels:
        app: labs-site
        servicegroup: "mine"
    spec:
      volumes:
      # nginx-unprivileged keeps its pid and temp files under /tmp, so the root
      # filesystem can stay read-only.
      - name: tmp
        emptyDir: {}
      containers:
      - name: labs-site
        # The page itself is built and published by 2143-Labs/site. The tag is
        # pinned in overlays/prod/kustomization.yaml; bump it after a site build.
        image: ghcr.io/2143-labs/site:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
          name: http
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault

        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "96Mi"
            cpu: "500m"

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 1
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: labs-site
spec:
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: labs-site
